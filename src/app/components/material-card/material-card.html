<article class="product-card">
	<img [src]="materiel().image" class="product-img" [alt]="materiel().nom">

	<div>
		<p class="muted">{{ materiel().categorie }}</p>
		<h3>{{ materiel().nom }}</h3>
		<p>{{ materiel().marque }}</p>
		<h3>{{ materiel().prix | prix }}</h3>
	</div>

	<div>
		<a mat-button color="primary" [routerLink]="['/produits', materiel().id]">Détail</a>
		<button mat-raised-button color="primary" (click)="boutique.ajouterPanier(materiel())" [disabled]="estIndisponible()">
			Ajouter au panier
		</button>
	</div>
</article>
