<section class="hero">
	<h1 [class]="bien">Bienvenue chez InfoLab</h1>
	<a mat-raised-button color="accent" routerLink="/produits">Voir les produits</a>
</section>

<main class="page">
	<h2>Pourquoi choisir InfoLab ?</h2>
	<div class="grid">
		<mat-card>
			<mat-card-content>
				<h3>Matériel de qualité</h3>
				<p>Des ordinateurs et accessoires pour tous les besoins.</p>
			</mat-card-content>
		</mat-card>

		<mat-card>
			<mat-card-content>
				<h3>Livraison</h3>
				<p>Une commande simple et un suivi de votre achat.</p>
			</mat-card-content>
		</mat-card>

		<mat-card>
			<mat-card-content>
				<h3>Assistance</h3>
				<p>Une garantie sur chaque matériel.</p>
			</mat-card-content>
		</mat-card>
	</div>
</main>
